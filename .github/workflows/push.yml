name: Push

on: push

jobs:
  build-and-lint:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      # `pnpm build`'s tsc covers src only, so the e2e harness -- the thing that
      # drives every host gate -- went unchecked until 2026-09-13.
      - name: Typecheck the e2e harness
        run: pnpm typecheck:test
      - name: Format check
        run: pnpm format:check
      - name: Unit tests
        run: pnpm vitest run --exclude '**/plugin.test.ts'

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Install JBrowse CLI
        run: npm install -g @jbrowse/cli
      - name: Setup JBrowse nightly
        run: jbrowse create .test-jbrowse-nightly --nightly
      - name: Run E2E tests
        run: pnpm vitest run test/plugin.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: test-screenshots/

  # Boots the candidate build on the oldest supported, newest and main hosted
  # JBrowse builds: a bundle that throws while evaluating error-pages every
  # config naming the plugin, and tsc and eslint cannot see it.
  host-compat:
    name: Host compat (candidate build on hosted JBrowse)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Build
        run: pnpm build
      - name: Boot the built bundle on hosted JBrowse
        run: pnpm host-compat:candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compat
          path: host-compat.json

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
