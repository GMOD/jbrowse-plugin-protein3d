name: Push

on: push

jobs:
  build-and-lint:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm prettier --check .
      - name: Unit tests
        run: pnpm vitest run --exclude '**/plugin.test.ts'

  e2e-tests:
    name: E2E tests (${{ matrix.jbrowse-version }})
    runs-on: ubuntu-latest
    needs: build-and-lint
    strategy:
      fail-fast: false
      matrix:
        jbrowse-version: [v4.3.0, nightly]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Install JBrowse CLI
        run: npm install -g @jbrowse/cli
      # GITHUB_TOKEN because `--tag` resolves the release through api.github.com,
      # and unauthenticated that is 60 requests an hour PER IP with runners
      # sharing addresses: this step failed with "Could not find version: rate
      # limit exceeded" on 2026-08-17 while every other job in the run passed,
      # and msaview lost the same leg a minute later. The published CLI ignores
      # the variable today (GMOD/jbrowse-components a6a8d4a553 teaches `fetchJson`
      # to send it); setting it now means the flake stops on its own the next
      # time `npm install -g @jbrowse/cli` picks up a release.
      - name: Setup JBrowse ${{ matrix.jbrowse-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.jbrowse-version }}" = "nightly" ]; then
            jbrowse create .test-jbrowse-nightly --nightly
          else
            jbrowse create .test-jbrowse-${{ matrix.jbrowse-version }} --tag ${{ matrix.jbrowse-version }}
          fi
      - name: Run E2E tests
        run:
          TEST_JBROWSE_VERSION=${{ matrix.jbrowse-version }} pnpm vitest run
          test/plugin.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.jbrowse-version }}
          path: test-screenshots/

  # Boots the CANDIDATE build on hosted JBrowse releases. The e2e job above runs
  # against a `jbrowse create` install, which is the host we develop on; this is
  # the one that answers "would publishing this error-page a config already in
  # the wild".
  #
  # It has to exist because the blast radius is the whole session, not one track:
  # PluginLoader runs Promise.all over the plugin list, so a bundle that throws
  # while evaluating takes the app to its error page for every config naming it.
  # And the store uploads `latest/` with no-cache, so that reaches configs
  # shipped months ago the moment a tag lands, with no staging step in between.
  # Two outages arrived this way -- an @mui/material/SvgIcon deep import the
  # released hosts re-export with a different shape, and a @jbrowse/core/util
  # export that vanished from the host's barrel. Neither is visible to tsc,
  # eslint, or a url reachability check; both are obvious the moment the bundle
  # is actually booted on the host.
  host-compat:
    name: Host compat (candidate build on hosted releases)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Build
        run: pnpm build
      - name: Boot the built bundle on released hosts
        run: pnpm host-compat:candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compat
          path: host-compat.json

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check spelling
        uses: crate-ci/typos@master
