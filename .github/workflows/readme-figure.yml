name: README figure

# Renders scripts/readme-figure.mjs from main's build on the JBrowse nightly and
# publishes it to the `readme-figure` branch, which the README links. A branch of
# its own keeps the bot's commits off main, where a push by GITHUB_TOKEN starts
# no Push run and would leave `pnpm version`'s green-CI gate nothing to find.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-figure
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get install -y pngquant
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Install JBrowse CLI
        run: npm install -g @jbrowse/cli
      - name: Setup JBrowse nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: jbrowse create .test-jbrowse-nightly --nightly
      - name: Fetch the published figure
        run: |
          mkdir -p img
          if git fetch --depth 1 origin readme-figure; then
            git show FETCH_HEAD:readme.png > img/readme.png
            cp img/readme.png /tmp/published.png
          fi
      - name: Render
        run: pnpm readme-figure
      - name: Publish if it changed
        run: |
          if cmp -s img/readme.png /tmp/published.png; then
            echo "figure unchanged"
            exit 0
          fi
          dir=$(mktemp -d)
          cp img/readme.png "$dir/readme.png"
          cd "$dir"
          git init -q -b readme-figure
          git add readme.png
          git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "README figure from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" readme-figure
